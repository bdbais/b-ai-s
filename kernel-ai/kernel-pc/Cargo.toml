[package]
name = "bais-kernel-pc"
version = "0.3.0"
edition = "2021"
description = "kernel-ai di B-AI-S v0.3 per PC x86_64 (multiboot2, BIOS): stesso desktop e gestore modelli della v0.3-rpi"
license = "Apache-2.0"

[dependencies]
bais-model = { path = "../model" }
libm = "0.2"

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 2
panic = "abort"

# crate a sé: target e opzioni di link diversi dal workspace del gestore modelli
[workspace]
